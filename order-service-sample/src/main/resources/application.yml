spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_service}
    username: ${DB_USER:order_service}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates it
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

# Camunda 8.9 SaaS connection (mode defaulted to `saas` by the framework camunda starter).
camunda:
  client:
    mode: saas
    auth:
      client-id: ${CAMUNDA_CLIENT_ID:}
      client-secret: ${CAMUNDA_CLIENT_SECRET:}
    cloud:
      cluster-id: ${CAMUNDA_CLUSTER_ID:}
      region: ${CAMUNDA_REGION:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

framework:
  camunda:
    multi-tenant: false
